name: Telefoon zoeken op bedrijfswebsites

# De KBO-gegevens komen elke ochtend om 6u30 op de branch gh-pages (geplande taak met de KBO-login,
# buiten GitHub). Deze workflow zoekt daarna voor bedrijven zonder telefoon het nummer op hun website
# en publiceert het resultaat. Er zijn geen secrets nodig.
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: websites
  cancel-in-progress: true

jobs:
  websites:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: main }
      - uses: actions/checkout@v4
        with: { ref: gh-pages, path: site }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Telefoon zoeken
        run: python3 main/job/kbo_job.py --enrich site/kbo-data.json
      - name: Publiceren
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kbo-data.json kbo-data.js
          git diff --cached --quiet && { echo "Niets nieuws"; exit 0; }
          git commit -q -m "Telefoonnummers van bedrijfswebsites $(date +%F)"
          git push
